; bach21 settings, one section per model kind. train.py, generate.py and evaluate.py use [note] (combined
; pitch+duration tokens); [pitch] and [duration] are for experiments with separate models
; (python train.py bach violin --kind pitch). Every key is described in docs/configuration.md.
; Keys left out of a section take the defaults listed in DEFAULTS in config.py.
;
; From-scratch training uses full weights (lora_enable = false).
; To fine-tune with LoRA, set lora_enable = true, lora_peft_only = true and
; base_model = <path to a model.torch of the same kind trained without LoRA>.
[pitch]
number_of_steps = 128
batch_size = 8
hidden_size = 256
number_of_epochs = 50
temperature = 2.0
window_stride = 32
early_stopping_patience = 0

[duration]
number_of_steps = 128
batch_size = 8
hidden_size = 64
number_of_epochs = 50
temperature = 2.0
window_stride = 32
early_stopping_patience = 0

[note]
number_of_steps = 128
batch_size = 64
hidden_size = 192
lora_enable = false
lora_peft_only = false
base_model =
; Music-aware layers (note model only).
; structured_embedding: a token's vector is the sum of a part of its own, a pitch part and a duration
; part, the last two shared with the other tokens of that pitch / duration.
; pitch_relations: a pitch-class part, the interval from the previous note as an input, and an output
; score per interval from the last note, so melodic habits carry over between keys.
; pattern_pointers: output scores for repeating the pitch, interval or duration of 1-12 notes ago.
; Experimental and off: the loss is slightly lower, the generated music is not better.
structured_embedding = true
pitch_relations = true
pattern_pointers = false
; Training: windows start at random places, redrawn for every batch (one epoch is about one visit per
; token). The learning rate warms up for lr_warmup_steps batches and then falls to 0 along a cosine over
; number_of_epochs, so a run has a fixed length; the epoch with the lowest validation loss is saved.
; window_stride only places the validation windows.
random_windows = true
number_of_epochs = 6
learning_rate = 0.002
lr_schedule = cosine
lr_warmup_steps = 100
grad_clip = 1.0
window_stride = 32
early_stopping_patience = 0
; Regularisation: tied input and output embeddings, dropout after the embedding and before the output
; layer, AdamW weight decay.
tie_weights = true
dropout = 0.4
output_dropout = 0.5
weight_decay = 0.2
; Data: training parts are also used transposed by up to +/-transpose semitones, within the instrument's
; pitch range. extra_training_data adds the composer's other parts that fit that range and do not double
; one of the instrument's parts, transposed by up to +/-transpose_extra. extra_composers adds parts of
; other composers under the same rules (for example: handel, vivaldi). It is empty because that lowered
; the loss without making the generated pieces better. Validation is always the instrument's own,
; untransposed parts.
transpose = 6
extra_training_data = true
extra_composers =
transpose_extra = 4
; Sampling in three steps: rest or note, then the pitch, then the duration. The pitch uses temperature,
; the other two rhythm_temperature (0 = one temperature for whole tokens instead). top_p < 1 draws only
; from the most likely pitches (nucleus sampling). motif_threshold > 0 continues a frequent corpus motif
; whenever the top probability is at or below it.
temperature = 0.8
rhythm_temperature = 1.0
top_p = 1.0
motif_threshold = 0
