; bach21 settings, one section per model kind. train.py and generate.py use [note] (combined pitch+duration
; tokens); [pitch] and [duration] are for experiments with separate models (python train.py bach violin --kind pitch).
; Keys left out of a section take the defaults listed in DEFAULTS in config.py.
;
; From-scratch training uses full weights (lora_enable = false).
; To fine-tune with LoRA, set lora_enable = true, lora_peft_only = true and
; base_model = <path to a model.torch of the same kind trained without LoRA>.
[pitch]
number_of_steps = 128
batch_size = 8
hidden_size = 256
number_of_epochs = 50
temperature = 2.0
window_stride = 32
early_stopping_patience = 0

[duration]
number_of_steps = 128
batch_size = 8
hidden_size = 64
number_of_epochs = 50
temperature = 2.0
window_stride = 32
early_stopping_patience = 0

[note]
number_of_steps = 128
batch_size = 64
hidden_size = 192
number_of_epochs = 50
temperature = 0.85
window_stride = 32
early_stopping_patience = 3
lora_enable = false
lora_peft_only = false
base_model =
; Regularisation: input and output embeddings share weights, dropout after the embedding and before
; the output layer, AdamW weight decay, and on an epoch without improvement the best weights are
; reloaded and the learning rate is multiplied by lr_decay.
tie_weights = true
dropout = 0.4
output_dropout = 0.5
weight_decay = 0.2
lr_decay = 0.25
; Data: training parts are also used transposed by up to +/-transpose semitones (within the pitch range
; of the real parts). extra_training_data adds the composer's other parts that fit that range and do not
; double a violin part, transposed by up to +/-transpose_extra. Validation is always untransposed violin.
transpose = 6
extra_training_data = true
transpose_extra = 4
; Sampling: top_p < 1 enables nucleus sampling; motif_threshold > 0 continues a frequent corpus motif
; whenever the top probability is at or below it (0 turns that off).
top_p = 1.0
motif_threshold = 0
