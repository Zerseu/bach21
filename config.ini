; bach21 settings, one section per model kind. train.py and generate.py use [note] (combined pitch+duration
; tokens); [pitch] and [duration] are for experiments with separate models (python train.py bach violin --kind pitch).
; Keys left out of a section take the defaults listed in DEFAULTS in config.py.
;
; From-scratch training uses full weights (lora_enable = false).
; To fine-tune with LoRA, set lora_enable = true, lora_peft_only = true and
; base_model = <path to a model.torch of the same kind trained without LoRA>.
[pitch]
number_of_steps = 128
batch_size = 8
hidden_size = 256
number_of_epochs = 50
temperature = 2.0
window_stride = 32
early_stopping_patience = 0

[duration]
number_of_steps = 128
batch_size = 8
hidden_size = 64
number_of_epochs = 50
temperature = 2.0
window_stride = 32
early_stopping_patience = 0

[note]
number_of_steps = 128
batch_size = 64
hidden_size = 192
lora_enable = false
lora_peft_only = false
base_model =
; Music-aware layers (note model only). structured_embedding builds every token's vector from a part of
; its own plus a pitch part and a duration part shared with all tokens of that pitch / duration.
; pitch_relations adds a pitch-class part, the interval from the previous note as an input, and output
; scores per interval from the last note, so melodic habits carry over between keys.
; pattern_pointers (experimental, off) adds output scores for repeating the pitch, interval or duration
; of 1-12 notes ago: a slightly lower loss, but no better music, and in one test far more pieces that
; got stuck repeating a figure.
structured_embedding = true
pitch_relations = true
pattern_pointers = false
; Training: windows start at random places (redrawn for every batch; one epoch is about one visit per
; token), and the learning rate warms up for lr_warmup_steps batches and then falls to 0 along a cosine
; over number_of_epochs, so a run always has the same length. The epoch with the lowest validation loss
; is the one saved. window_stride only places the validation windows.
random_windows = true
number_of_epochs = 6
learning_rate = 0.002
lr_schedule = cosine
lr_warmup_steps = 100
grad_clip = 1.0
window_stride = 32
early_stopping_patience = 0
; Regularisation: input and output embeddings share weights, dropout after the embedding and before
; the output layer, AdamW weight decay.
tie_weights = true
dropout = 0.4
output_dropout = 0.5
weight_decay = 0.2
; Data: training parts are also used transposed by up to +/-transpose semitones (within the pitch range
; of the real parts). extra_training_data adds the composer's other parts that fit that range and do not
; double a violin part, transposed by up to +/-transpose_extra. extra_composers can name other composers
; of the cache whose parts are added under the same rules (for example: handel, vivaldi). That lowers
; the loss further and takes longer to train, but the generated pieces were not better, so it is empty.
; Validation is always the composer's own untransposed violin parts.
transpose = 6
extra_training_data = true
extra_composers =
transpose_extra = 4
; Sampling: a token is drawn in three steps: rest or note, then the pitch, then the duration. The pitch
; uses temperature, the other two rhythm_temperature (rhythm needs the higher one; rhythm_temperature = 0
; goes back to one temperature for whole tokens). top_p < 1 enables nucleus sampling of the pitch;
; motif_threshold > 0 continues a frequent corpus motif whenever the top probability is at or below it
; (0 turns that off).
temperature = 0.8
rhythm_temperature = 1.0
top_p = 1.0
motif_threshold = 0
